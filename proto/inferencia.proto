syntax = "proto3";

package inferencia;

service InferenciaService {
  rpc Prever (RequisicaoInferencia) returns (RespostaInferencia);
  rpc PreverLote (RequisicaoLote) returns (RespostaLote);
}

message RequisicaoInferencia {
  string texto = 1;
}

message RespostaInferencia {
  string sentimento = 1;
  float confianca = 2;
}

message RequisicaoLote {
  repeated string textos = 1;
}

message RespostaLote {
  repeated RespostaInferencia resultados = 1;
}
